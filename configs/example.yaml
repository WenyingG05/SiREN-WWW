# Fully synthetic, small example. Replace the model and credentials for a live run.
method: risk_belief_graph
simulation:
  total_steps: 2
  random_seed: 42
params:
  beta: 0.7
  gamma: 1.0
  c: 1.0
cognition:
  max_cues_per_batch: 2
  activation_hops: 2
  seed_top_r: 1
  retrieval_threshold: 0.75
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  retrieval_log_top_n: 10
  belief_match_threshold: 0.95
reading:
  max_posts: null
  order: input
network:
  type: barabasi_albert
  m: 1
  media_follow_prob: 1.0
llm:
  model: REPLACE_WITH_YOUR_MODEL
  temperature: 0.7
  max_tokens: 4096
  timeout_seconds: 60
  max_attempts: 3
  retry_delay_seconds: 1.0
initialization:
  description: Synthetic flood scenario for a runnable example
agents:
  - agent_id: person_1
    language: en
    center_risk_object: Local river flooding
    profile:
      relevant_knowledge: Has read general flood safety advice.
      prior_experience: Experienced a minor flood years ago.
      cultural_worldview: Values neighborhood cooperation.
      activity_background: Occasionally posts short updates.
    event_memory: A previous flood briefly disrupted a commute.
    belief_graph:
      center_id: center
      nodes:
        - node_id: center
          text: Local river flooding
          signal: Neutral
          confidence: 1.0
          significance: 0.0
        - node_id: barrier
          text: Flood barriers can protect low-lying streets when installed correctly.
          signal: Safety
          confidence: 0.7
          significance: 0.6
      edges:
        - source_id: center
          target_id: barrier
          origin: prior
    mood: 0.0
  - agent_id: person_2
    language: en
    center_risk_object: Local river flooding
    profile:
      relevant_knowledge: Knows where local flood alerts are posted.
      prior_experience: No prior local flood experience.
      cultural_worldview: Prefers checking official updates.
      activity_background: Reads often and posts occasionally.
    event_memory: ''
    mood: 0.0
media:
  records:
    - record_id: synthetic_notice_1
      media_agent_id: local_notice
      content: The river has risen after heavy rain. A temporary flood barrier is in place near the lower street; residents should monitor local updates.
      published_step: 0
output_dir: output/example
